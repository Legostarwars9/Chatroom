<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Chat</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111;
        color: #eee;
    }

    button,
    input {
        font: inherit;
    }

    button {
        cursor: pointer;
    }

    #loginScreen,
    #registerScreen {
        width: 350px;
        max-width: calc(100% - 30px);
        margin: 80px auto;
        padding: 25px;
        background: #1c1c1c;
        border-radius: 10px;
    }

    #loginScreen h1,
    #registerScreen h1 {
        margin-top: 0;
        text-align: center;
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 5px 0;
        border: 1px solid #444;
        border-radius: 5px;
        background: #111;
        color: white;
    }

    button {
        padding: 9px 14px;
        margin: 4px 2px;
        border: none;
        border-radius: 5px;
        background: #333;
        color: white;
    }

    button:hover {
        background: #444;
    }

    .primary {
        background: #2463d4;
    }

    .primary:hover {
        background: #3174ed;
    }

    .danger {
        background: #9b2525;
    }

    .danger:hover {
        background: #bd3030;
    }

    .message {
        margin: 5px 0;
        padding: 7px 10px;
        background: #181818;
        border-radius: 5px;
        word-wrap: break-word;
    }

    .message-id {
        color: #777;
        font-size: 11px;
        margin-left: 5px;
    }

    .delete-button {
        margin-left: 8px;
        padding: 3px 7px;
        font-size: 11px;
    }

    #chatScreen {
        display: none;
        height: 100vh;
        overflow: hidden;
    }

    #topBar {
        height: 55px;
        background: #1b1b1b;
        border-bottom: 1px solid #333;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
    }

    #roomLabel {
        font-weight: bold;
        margin-right: auto;
    }

    #connectionStatus {
        font-size: 12px;
        color: #aaa;
    }

    #main {
        display: flex;
        height: calc(100vh - 55px);
    }

    #sidebar {
        width: 220px;
        min-width: 180px;
        background: #171717;
        border-right: 1px solid #333;
        padding: 12px;
        overflow-y: auto;
    }

    #sidebar h3 {
        margin-top: 5px;
    }

    #onlineUsers {
        list-style: none;
        padding: 0;
        margin: 5px 0;
    }

    #onlineUsers li {
        padding: 4px;
    }

    #chatArea {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    #messages {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
    }

    #inputArea {
        display: flex;
        gap: 5px;
        padding: 10px;
        background: #1b1b1b;
        border-top: 1px solid #333;
    }

    #messageInput {
        flex: 1;
        margin: 0;
    }

    #roomControls {
        margin-bottom: 15px;
    }

    #roomControls input {
        margin-bottom: 4px;
    }

    #adminControls {
        display: none;
        border-top: 1px solid #333;
        margin-top: 15px;
        padding-top: 10px;
    }

    #loginMessage,
    #registerMessage {
        min-height: 20px;
        color: #f66;
        margin-top: 8px;
    }

    #registerScreen {
        display: none;
    }

    .room-button {
        width: 100%;
        text-align: left;
        margin: 2px 0;
    }

    @media (max-width: 700px) {
        #sidebar {
            width: 160px;
            min-width: 160px;
        }

        #topBar {
            overflow-x: auto;
        }
    }
</style>
</head>

<body>

<div id="loginScreen">
    <h1>Web Chat</h1>

    <input
        id="loginUsername"
        type="text"
        placeholder="Username"
        autocomplete="username"
    >

    <input
        id="loginPassword"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
    >

    <button class="primary" onclick="login()">Login</button>
    <button onclick="showRegister()">Register</button>

    <div id="loginMessage"></div>
</div>


<div id="registerScreen">
    <h1>Register</h1>

    <input
        id="registerUsername"
        type="text"
        placeholder="Username"
        autocomplete="username"
    >

    <input
        id="registerPassword"
        type="password"
        placeholder="Password"
        autocomplete="new-password"
    >

    <button class="primary" onclick="register()">Register</button>
    <button onclick="showLogin()">Back</button>

    <div id="registerMessage"></div>
</div>


<div id="chatScreen">

    <div id="topBar">

        <span id="roomLabel">Public</span>

        <span id="connectionStatus">
            Connecting...
        </span>

        <button onclick="logout()">
            Logout
        </button>

    </div>


    <div id="main">

        <div id="sidebar">

            <div id="roomControls">

                <h3>Rooms</h3>

                <button
                    class="room-button"
                    onclick="switchRoom('public')"
                >
                    Public
                </button>

                <input
                    id="roomInput"
                    type="text"
                    placeholder="Room name"
                >

                <button onclick="switchRoomFromInput()">
                    Join Room
                </button>

                <button onclick="newRoom()">
                    New Room
                </button>

            </div>


            <h3>Online</h3>

            <ul id="onlineUsers"></ul>


            <div id="adminControls">

                <h3>Admin</h3>

                <label>
                    <input
                        id="showIDsCheckbox"
                        type="checkbox"
                        onchange="refreshCurrentRoom()"
                    >
                    Show message IDs
                </label>

                <br>

                <label>
                    <input
                        id="showDeleteCheckbox"
                        type="checkbox"
                        onchange="refreshCurrentRoom()"
                    >
                    Show delete buttons
                </label>

            </div>

        </div>


        <div id="chatArea">

            <div id="messages"></div>

            <div id="inputArea">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Message..."
                    autocomplete="off"
                >

                <button
                    class="primary"
                    onclick="send()"
                >
                    Send
                </button>

            </div>

        </div>

    </div>

</div>


<script>

/*
 * ============================================================
 * WebSocket servers
 * ============================================================
 *
 * The startup script automatically replaces the
 * TRY_CLOUDFLARE_SERVER line with the current Quick Tunnel.
 *
 * Keep the permanent servers first.
 */

const TRY_CLOUDFLARE_SERVER =
    "wss://__TRY_CLOUDFLARE_URL__/ws";

const WS_URLS = [
    "wss://chat.legostarwars9.com/ws",

    // CHANGE THIS to your actual permanent backup domain.
    "wss://chatfqdn.legoserver.playit.plus:16509/ws",

    TRY_CLOUDFLARE_SERVER
];


/*
 * ============================================================
 * State
 * ============================================================
 */

let socket = null;

let username = "";
let room = "public";
let isAdmin = false;

let currentServerIndex = 0;
let reconnectTimer = null;
let pingTimer = null;

let manuallyClosed = false;


/*
 * ============================================================
 * Utility
 * ============================================================
 */

function setConnectionStatus(text) {
    document.getElementById("connectionStatus").textContent = text;
}


function showLogin() {
    document.getElementById("loginScreen").style.display = "block";
    document.getElementById("registerScreen").style.display = "none";
    document.getElementById("chatScreen").style.display = "none";
}


function showRegister() {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("registerScreen").style.display = "block";
}


function showChat() {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("registerScreen").style.display = "none";
    document.getElementById("chatScreen").style.display = "block";

    document.getElementById("roomLabel").textContent =
        "Room: " + room;

    if (isAdmin) {
        document.getElementById("adminControls").style.display = "block";
    } else {
        document.getElementById("adminControls").style.display = "none";
    }
}


/*
 * ============================================================
 * WebSocket connection
 * ============================================================
 */

function connect() {

    if (
        socket &&
        (
            socket.readyState === WebSocket.OPEN ||
            socket.readyState === WebSocket.CONNECTING
        )
    ) {
        return;
    }

    manuallyClosed = false;

    tryServer(0);
}


function tryServer(index) {

    if (manuallyClosed) {
        return;
    }

    if (index >= WS_URLS.length) {

        setConnectionStatus(
            "Disconnected - retrying..."
        );

        socket = null;

        clearTimeout(reconnectTimer);

        reconnectTimer = setTimeout(() => {
            tryServer(0);
        }, 5000);

        return;
    }


    currentServerIndex = index;

    const url = WS_URLS[index];

    /*
     * Do not try the placeholder if the startup script
     * has not inserted a Quick Tunnel yet.
     */
    if (
        url.includes("__TRY_CLOUDFLARE_URL__")
    ) {
        tryServer(index + 1);
        return;
    }


    setConnectionStatus(
        "Connecting..."
    );

    console.log(
        "Trying WebSocket server:",
        url
    );


    let ws;

    try {
        ws = new WebSocket(url);
    } catch (error) {

        console.error(
            "Failed to create WebSocket:",
            error
        );

        tryServer(index + 1);

        return;
    }


    socket = ws;


    ws.onopen = () => {

        if (socket !== ws) {
            return;
        }

        console.log(
            "Connected to:",
            url
        );

        setConnectionStatus(
            "Connected"
        );


        /*
         * A successful connection means that future
         * failures should try the primary again.
         */
        currentServerIndex = 0;


        /*
         * Send the saved authentication token if
         * the user was previously logged in.
         */
        const token =
            localStorage.getItem("chat_token");

        if (token) {

            ws.send(JSON.stringify({
                type: "token_login",
                token: token
            }));

        }


        startPing();
    };


    ws.onmessage = (event) => {

        if (socket !== ws) {
            return;
        }

        handleWebSocketMessage(event);

    };


    ws.onerror = (error) => {

        console.error(
            "WebSocket error:",
            url,
            error
        );

    };


    ws.onclose = () => {

        console.log(
            "WebSocket closed:",
            url
        );

        stopPing();

        if (socket !== ws) {
            return;
        }

        socket = null;

        if (manuallyClosed) {
            return;
        }

        /*
         * Try the next server.
         */
        tryServer(index + 1);

    };
}


/*
 * ============================================================
 * WebSocket sending
 * ============================================================
 */

function sendWS(data) {

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {
        console.error(
            "WebSocket is not connected."
        );

        setConnectionStatus(
            "Disconnected"
        );

        return false;
    }

    socket.send(
        JSON.stringify(data)
    );

    return true;
}


/*
 * ============================================================
 * Ping / keepalive
 * ============================================================
 */

function startPing() {

    stopPing();

    pingTimer = setInterval(() => {

        if (
            socket &&
            socket.readyState === WebSocket.OPEN
        ) {
            sendWS({
                type: "ping"
            });
        }

    }, 20000);
}


function stopPing() {

    if (pingTimer) {
        clearInterval(pingTimer);
        pingTimer = null;
    }
}


/*
 * ============================================================
 * WebSocket message handling
 * ============================================================
 */

function handleWebSocketMessage(event) {

    let data;

    try {

        data = JSON.parse(
            event.data
        );

    } catch (error) {

        console.error(
            "Invalid WebSocket message:",
            event.data
        );

        return;
    }


    switch (data.type) {

        case "login":

            handleLoginResponse(data);

            break;


        case "register":

            handleRegisterResponse(data);

            break;


        case "connected":

            handleConnected(data);

            break;


        case "message":

            addMessage(data);

            break;


        case "users":

            renderUsers(
                data.users || []
            );

            break;


        case "room":

            handleRoom(data);

            break;


        case "new_room":

            handleNewRoom(data);

            break;


        case "command":

            handleCommand(data);

            break;


        case "refresh":

            refreshCurrentRoom();

            break;


        case "pong":

            break;


        case "error":

            console.error(
                "Server error:",
                data.message
            );

            alert(
                data.message || "Server error"
            );

            break;


        default:

            console.warn(
                "Unknown server message:",
                data
            );

            break;
    }
}


/*
 * ============================================================
 * Login
 * ============================================================
 */

function login() {

    const user =
        document.getElementById(
            "loginUsername"
        ).value.trim();

    const password =
        document.getElementById(
            "loginPassword"
        ).value;


    if (!user || !password) {

        document.getElementById(
            "loginMessage"
        ).textContent =
            "Enter a username and password.";

        return;
    }


    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {
        document.getElementById(
            "loginMessage"
        ).textContent =
            "Not connected to the server.";

        return;
    }


    sendWS({
        type: "login",
        username: user,
        password: password
    });
}


/*
 * ============================================================
 * Register
 * ============================================================
 */

function register() {

    const user =
        document.getElementById(
            "registerUsername"
        ).value.trim();

    const password =
        document.getElementById(
            "registerPassword"
        ).value;


    if (!user || !password) {

        document.getElementById(
            "registerMessage"
        ).textContent =
            "Enter a username and password.";

        return;
    }


    sendWS({
        type: "register",
        username: user,
        password: password
    });
}


function handleLoginResponse(data) {

    if (
        data.status_code &&
        data.status_code !== 200
    ) {

        document.getElementById(
            "loginMessage"
        ).textContent =
            data.message || "Login failed.";

        return;
    }


    if (data.success === false) {

        document.getElementById(
            "loginMessage"
        ).textContent =
            data.message || "Login failed.";

        return;
    }


    /*
     * The backend should send the authentication token
     * after successful login.
     */
    if (data.token) {

        localStorage.setItem(
            "chat_token",
            data.token
        );

    }


    if (data.username) {
        username = data.username;
        localStorage.setItem(
            "chat_user",
            username
        );
    }

}


function handleRegisterResponse(data) {

    if (
        data.status_code &&
        data.status_code !== 200
    ) {

        document.getElementById(
            "registerMessage"
        ).textContent =
            data.message || "Registration failed.";

        return;
    }


    if (data.success === false) {

        document.getElementById(
            "registerMessage"
        ).textContent =
            data.message || "Registration failed.";

        return;
    }


    document.getElementById(
        "registerMessage"
    ).textContent =
        data.message || "Account created.";

    showLogin();
}


/*
 * ============================================================
 * Connected
 * ============================================================
 */

function handleConnected(data) {

    if (data.username) {

        username =
            data.username;

        localStorage.setItem(
            "chat_user",
            username
        );
    }


    if (data.token) {

        localStorage.setItem(
            "chat_token",
            data.token
        );
    }


    if (data.room) {
        room = data.room;
    }


    if (data.is_admin !== undefined) {
        isAdmin = data.is_admin;
    }


    showChat();


    /*
     * Some versions of the backend send the initial
     * room messages/users with connected.
     */
    if (data.messages) {
        renderMessages(
            data.messages
        );
    }

    if (data.users) {
        renderUsers(
            data.users
        );
    }
}


/*
 * ============================================================
 * Logout
 * ============================================================
 */

function logout() {

    manuallyClosed = true;

    stopPing();

    clearTimeout(reconnectTimer);


    if (
        socket &&
        socket.readyState === WebSocket.OPEN
    ) {

        sendWS({
            type: "logout"
        });

        /*
         * Give the logout message a moment to leave
         * before closing the connection.
         */
        setTimeout(() => {

            if (socket) {
                socket.close();
            }

        }, 100);

    } else {

        cleanupLocalLogin();

    }
}


function cleanupLocalLogin() {

    localStorage.removeItem(
        "chat_token"
    );

    localStorage.removeItem(
        "chat_user"
    );

    username = "";
    isAdmin = false;
    room = "public";

    showLogin();
}


/*
 * ============================================================
 * Commands
 * ============================================================
 */

function sendCommand(command) {

    return sendWS({
        type: "command",
        command: command
    });
}


function handleCommand(data) {

    if (
        data.role !== undefined
    ) {

        isAdmin =
            data.role === "admin" ||
            data.role === "administrator" ||
            data.role === true;

        if (isAdmin) {
            document.getElementById(
                "adminControls"
            ).style.display = "block";
        }

        return;
    }


    if (data.message) {

        /*
         * Don't automatically alert every successful
         * command because commands such as delete/mute
         * may already have visible effects.
         */
        if (
            data.status_code &&
            data.status_code >= 400
        ) {
            alert(data.message);
        }
    }
}


/*
 * ============================================================
 * Admin role
 * ============================================================
 */

function checkAdmin() {

    sendCommand(
        "/checkrole"
    );
}


/*
 * ============================================================
 * Sending messages
 * ============================================================
 */

function send() {

    const input =
        document.getElementById(
            "messageInput"
        );

    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {
        alert(
            "Not connected to the server."
        );

        return;
    }


    /*
     * Slash commands go through the same WebSocket.
     */
    if (message.startsWith("/")) {

        sendCommand(message);

    } else {

        sendWS({
            type: "send",
            room: room,
            message: message
        });

    }


    input.value = "";
    input.focus();
}


/*
 * Allow Enter to send.
 */

document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                send();
            }

        }
    );


/*
 * ============================================================
 * Messages
 * ============================================================
 */

function renderMessages(messages) {

    const container =
        document.getElementById(
            "messages"
        );

    container.innerHTML = "";


    for (const message of messages) {
        addMessage(message);
    }


    container.scrollTop =
        container.scrollHeight;
}


function addMessage(data) {

    const container =
        document.getElementById(
            "messages"
        );


    const div =
        document.createElement(
            "div"
        );

    div.className =
        "message";


    /*
     * The backend's normal message format is:
     *
     * [HH:MM:SS]|username: message
     */
    div.textContent =
        data.text || "";


    if (
        document.getElementById(
            "showIDsCheckbox"
        ).checked &&
        data.id
    ) {

        const id =
            document.createElement(
                "span"
            );

        id.className =
            "message-id";

        id.textContent =
            "ID: " + data.id;

        div.appendChild(id);
    }


    if (
        document.getElementById(
            "showDeleteCheckbox"
        ).checked &&
        data.id &&
        isAdmin
    ) {

        const deleteButton =
            document.createElement(
                "button"
            );

        deleteButton.className =
            "delete-button danger";

        deleteButton.textContent =
            "Delete";

        deleteButton.onclick =
            () => deleteMsg(data.id);

        div.appendChild(
            deleteButton
        );
    }


    container.appendChild(
        div
    );

    container.scrollTop =
        container.scrollHeight;
}


/*
 * ============================================================
 * Delete message
 * ============================================================
 */

function deleteMsg(id) {

    if (!id) {
        return;
    }

    sendCommand(
        "/delete " + id
    );
}


/*
 * ============================================================
 * Rooms
 * ============================================================
 */

function switchRoom(roomName) {

    roomName =
        String(roomName || "")
            .trim();


    if (!roomName) {
        return;
    }


    sendWS({
        type: "join",
        room: roomName
    });
}


function switchRoomFromInput() {

    const input =
        document.getElementById(
            "roomInput"
        );

    const roomName =
        input.value.trim();

    if (!roomName) {
        return;
    }

    switchRoom(roomName);
}


function handleRoom(data) {

    if (data.room) {

        room =
            data.room;

        document.getElementById(
            "roomLabel"
        ).textContent =
            "Room: " + room;
    }


    if (data.messages) {

        renderMessages(
            data.messages
        );

    } else {

        /*
         * If the backend only tells us the room,
         * request it again through the WebSocket.
         */
        refreshCurrentRoom();
    }
}


function refreshCurrentRoom() {

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {
        return;
    }


    sendWS({
        type: "join",
        room: room
    });
}


function newRoom() {

    sendWS({
        type: "new_room"
    });
}


function handleNewRoom(data) {

    if (data.room) {

        room =
            data.room;

        document.getElementById(
            "roomLabel"
        ).textContent =
            "Room: " + room;
    }


    if (data.messages) {

        renderMessages(
            data.messages
        );
    }
}


/*
 * ============================================================
 * Online users
 * ============================================================
 */

function renderUsers(users) {

    const list =
        document.getElementById(
            "onlineUsers"
        );

    list.innerHTML = "";


    for (const user of users) {

        const li =
            document.createElement(
                "li"
            );

        li.textContent =
            user;

        list.appendChild(
            li
        );
    }
}


/*
 * ============================================================
 * Page startup
 * ============================================================
 */

window.addEventListener(
    "load",
    function() {

        /*
         * Start the WebSocket connection immediately.
         *
         * If a token exists, connect() will send
         * token_login after the socket opens.
         */
        connect();

    }
);

</script>

</body>
</html>
