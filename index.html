<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Website Chat</title>

<style>
body {
    margin: 0;
    background: #1e2128;
    color: #e6e6e6;
    font-family: Arial;
}

#container {
    display: flex;
    height: 100vh;
}

#chatArea {
    flex: 1;
    padding: 15px;
}

#sidebar {
    width: 180px;
    background: #14161c;
    border-left: 1px solid #3a3f4a;
    padding: 10px;
}

h2 {
    color: #7aa2f7;
    margin-top: 0;
}

input, button {
    background: #2a2f3a;
    color: #fff;
    border: 1px solid #3a3f4a;
    padding: 5px;
    margin: 2px;
}

button:hover {
    background: #3a3f4a;
    cursor: pointer;
}

#chatBox {
    height: 65vh;
    background: #111;
    border: 1px solid #3a3f4a;
    overflow-y: auto;
    padding: 6px;
    white-space: pre-wrap;
}

.user {
    padding: 2px;
    font-size: 14px;
}

.message {
    margin-bottom: 4px;
}

.timestamp {
    color: #888;
    font-size: 12px;
}

.username {
    color: #7aa2f7;
    font-weight: bold;
}

.msgid {
    color: #555;
    font-size: 10px;
    margin-left: 5px;
}

.deleteBtn {
    color: #f55;
    background: none;
    border: none;
    cursor: pointer;
    margin-left: 5px;
}

#statusPopup {
    position: fixed;
    right: 16px;
    bottom: 16px;
    max-width: 300px;
    padding: 8px 10px;
    background: #2a2f3a;
    color: #e6e6e6;
    border: 1px solid #3a3f4a;
    border-radius: 6px;
    font-size: 12px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
    white-space: pre-wrap;
    z-index: 1000;
}

#statusPopup.show {
    opacity: 1;
    transform: translateY(0);
}
</style>
</head>

<body>

<div id="statusPopup"></div>

<div id="container">

<div id="chatArea">

<h2>Website Chat</h2>

<div id="login">

    <input id="username" placeholder="Username">

    <input
        id="password"
        type="password"
        placeholder="Password"
    >

    <button onclick="login()">Login</button>

    <button onclick="register()">Create Account</button>

    <div
        id="error"
        style="color:#ff5555; margin-top:5px;"
    ></div>

</div>

<div id="chat" style="display:none;">

    <div>

        <button onclick="switchRoom('public')">
            Public
        </button>

        <button onclick="newRoom()">
            New Room
        </button>

        <input
            id="roomCode"
            placeholder="Enter Room Code"
            style="width:120px;"
        >

        <button onclick="joinRoom()">
            Join
        </button>

        <span id="roomLabel"></span>

        <label
            id="showIDsLabel"
            style="margin-left:10px; display:none;"
        >
            <input
                type="checkbox"
                id="showIDs"
            >
            Show Message IDs
        </label>

        <label
            id="showDeleteLabel"
            style="margin-left:10px; display:none;"
        >
            <input
                type="checkbox"
                id="showDelete"
            >
            Show Quick Delete Buttons
        </label>

    </div>

    <div id="chatBox"></div>

    <input
        id="message"
        style="width:70%"
        placeholder="Message or command"
        maxlength="1000"
    >

    <button onclick="send()">
        Send
    </button>

    <button onclick="logout()">
        Logout
    </button>

</div>

</div>

<div id="sidebar">

    <b>Online Users</b>

    <div id="userList"></div>

</div>

</div>

<script>

const WS_URL =
    "wss://chat.legostarwars9.com/ws";

let socket = null;
let username = "";
let room = "public";
let isAdmin = false;
let pingTimer = null;
let reconnectTimer = null;
let intentionalClose = false;


const loginDiv =
    document.getElementById("login");

const chatDiv =
    document.getElementById("chat");

const usernameInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const errorDiv =
    document.getElementById("error");

const chatBox =
    document.getElementById("chatBox");

const messageInput =
    document.getElementById("message");

const userList =
    document.getElementById("userList");

const roomLabel =
    document.getElementById("roomLabel");

const showIDsCheckbox =
    document.getElementById("showIDs");

const showIDsLabel =
    document.getElementById("showIDsLabel");

const showDeleteCheckbox =
    document.getElementById("showDelete");

const showDeleteLabel =
    document.getElementById("showDeleteLabel");

const statusPopup =
    document.getElementById("statusPopup");


function showStatus(message) {

    statusPopup.textContent =
        message;

    statusPopup.classList.add("show");

    setTimeout(() => {
        statusPopup.classList.remove("show");
    }, 3000);
}


function connect() {

    intentionalClose = false;

    if (
        socket &&
        (
            socket.readyState === WebSocket.OPEN ||
            socket.readyState === WebSocket.CONNECTING
        )
    ) {
        return;
    }


    socket = new WebSocket(
        WS_URL
    );


    socket.onopen = function() {

        console.log(
            "WebSocket connected"
        );

        startPing();

        const savedToken =
            localStorage.getItem(
                "chat_token"
            );

        const savedUser =
            localStorage.getItem(
                "chat_user"
            );


        if (
            savedToken &&
            savedUser
        ) {

            socket.send(
                JSON.stringify({
                    type: "token_login",
                    token: savedToken
                })
            );

        }
    };


    socket.onmessage = function(event) {

        let data;

        try {

            data =
                JSON.parse(event.data);

        } catch {

            console.error(
                "Invalid WebSocket message:",
                event.data
            );

            return;
        }


        handleMessage(data);
    };


    socket.onerror = function(error) {

        console.error(
            "WebSocket error:",
            error
        );
    };


    socket.onclose = function() {

        stopPing();

        socket = null;

        if (intentionalClose) {
            return;
        }


        if (
            loginDiv.style.display === "none"
        ) {

            showStatus(
                "Connection lost. Reconnecting..."
            );
        }


        clearTimeout(
            reconnectTimer
        );


        reconnectTimer =
            setTimeout(
                connect,
                3000
            );
    };
}


function handleMessage(data) {

    if (data.type === "login") {

        if (data.status === "ok") {

            username =
                data.user;

            localStorage.setItem(
                "chat_token",
                data.token
            );

            localStorage.setItem(
                "chat_user",
                username
            );

            showChat();

        } else {

            errorDiv.textContent =
                data.status === "banned"
                    ? "You are banned."
                    : data.status === "ip_banned"
                        ? "Your IP is banned."
                        : "Login failed.";
        }

        return;
    }


    if (data.type === "register") {

        if (data.status === "ok") {

            errorDiv.textContent =
                "Account created!";

        } else if (
            data.status === "exists"
        ) {

            errorDiv.textContent =
                "Username exists";

        } else {

            errorDiv.textContent =
                "Invalid username/password";
        }

        return;
    }


    if (data.type === "connected") {

        username =
            data.user;

        room =
            data.room || "public";

        renderUsers(
            data.users || []
        );

        renderMessages(
            data.messages || []
        );

        return;
    }


    if (data.type === "message") {

        const atBottom =
            chatBox.scrollTop +
            chatBox.clientHeight >=
            chatBox.scrollHeight - 5;


        appendMessage(
            data.message
        );


        if (atBottom) {

            chatBox.scrollTop =
                chatBox.scrollHeight;
        }

        return;
    }


    if (data.type === "users") {

        renderUsers(
            data.users || []
        );

        return;
    }


    if (data.type === "room") {

        room =
            data.room;

        renderMessages(
            data.messages || []
        );

        return;
    }


    if (data.type === "new_room") {

        if (data.status === "ok") {

            switchRoom(
                data.room
            );
        }

        return;
    }


    if (data.type === "command") {

        if (data.status_code === 403) {

            showStatus(
                "Admin only."
            );

            return;
        }


        if (data.status_code === 404) {

            showStatus(
                "User not found."
            );

            return;
        }


        if (data.message) {

            showStatus(
                data.message
            );
        }


        if (data.role) {

            isAdmin =
                data.role === "admin";

            updateAdminControls();
        }

        return;
    }


    if (data.type === "refresh") {

        switchRoom(room);

        return;
    }


    if (data.type === "error") {

        if (data.message === "muted") {

            showStatus(
                "You are muted."
            );

        } else if (
            data.message === "rate"
        ) {

            showStatus(
                "You are sending messages too quickly."
            );

        } else {

            showStatus(
                data.message
            );
        }

        return;
    }
}


function login() {

    const user =
        usernameInput.value.trim();

    const password =
        passwordInput.value;

    if (!user || !password) {

        errorDiv.textContent =
            "Enter username and password";

        return;
    }


    ensureConnection(() => {

        socket.send(
            JSON.stringify({
                type: "login",
                username: user,
                password: password
            })
        );

    });
}


function register() {

    const user =
        usernameInput.value.trim();

    const password =
        passwordInput.value;

    if (!user || !password) {

        errorDiv.textContent =
            "Enter username/password";

        return;
    }


    ensureConnection(() => {

        socket.send(
            JSON.stringify({
                type: "register",
                username: user,
                password: password
            })
        );

    });
}


function ensureConnection(callback) {

    if (
        socket &&
        socket.readyState === WebSocket.OPEN
    ) {

        callback();
        return;
    }


    showStatus(
        "Connecting..."
    );


    const oldSocket =
        socket;


    const handler = function() {

        socket.removeEventListener(
            "open",
            handler
        );

        callback();
    };


    if (oldSocket) {

        oldSocket.addEventListener(
            "open",
            handler
        );

    } else {

        connect();

        socket.addEventListener(
            "open",
            handler
        );
    }
}


function showChat() {

    loginDiv.style.display =
        "none";

    chatDiv.style.display =
        "block";

    checkAdmin();
}


function checkAdmin() {

    sendCommand(
        "/checkrole"
    );
}


function updateAdminControls() {

    if (isAdmin) {

        showIDsLabel.style.display =
            "inline";

        showDeleteLabel.style.display =
            "inline";

    } else {

        showIDsLabel.style.display =
            "none";

        showDeleteLabel.style.display =
            "none";
    }


    renderMessagesFromDOM();
}


function send() {

    const message =
        messageInput.value.trim();

    if (!message) {
        return;
    }


    messageInput.value = "";


    if (message.startsWith("/")) {

        sendCommand(message);
        return;
    }


    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {

        showStatus(
            "Not connected."
        );

        return;
    }


    socket.send(
        JSON.stringify({
            type: "send",
            room: room,
            message: message
        })
    );
}


function sendCommand(command) {

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {

        showStatus(
            "Not connected."
        );

        return;
    }


    socket.send(
        JSON.stringify({
            type: "command",
            command: command
        })
    );
}


messageInput.onkeydown = function(event) {

    if (event.key === "Enter") {
        send();
    }
};


function logout() {

    intentionalClose = true;

    localStorage.removeItem(
        "chat_token"
    );

    localStorage.removeItem(
        "chat_user"
    );


    if (socket) {

        socket.send(
            JSON.stringify({
                type: "logout"
            })
        );

        socket.close();

        socket = null;
    }


    location.reload();
}


function switchRoom(newRoom) {

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {

        showStatus(
            "Not connected."
        );

        return;
    }


    socket.send(
        JSON.stringify({
            type: "join",
            room: newRoom
        })
    );
}


function joinRoom() {

    const code =
        document
            .getElementById("roomCode")
            .value
            .trim();


    if (code) {
        switchRoom(code);
    }
}


function newRoom() {

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {

        showStatus(
            "Not connected."
        );

        return;
    }


    socket.send(
        JSON.stringify({
            type: "new_room"
        })
    );
}


function deleteMsg(id) {

    sendCommand(
        `/delete ${id}`
    );
}


function renderUsers(users) {

    userList.innerHTML = "";


    users.forEach(user => {

        const div =
            document.createElement("div");

        div.className =
            "user";

        div.textContent =
            user;

        userList.appendChild(
            div
        );
    });
}


function renderMessages(messages) {

    chatBox.innerHTML = "";


    messages.forEach(message => {

        appendMessage(
            message
        );
    });


    roomLabel.textContent =
        room === "public"
            ? ""
            : "Room " + room;


    chatBox.scrollTop =
        chatBox.scrollHeight;
}


function appendMessage(message) {

    if (
        !message ||
        !message.text
    ) {
        return;
    }


    const parts =
        message.text.split("|");


    if (parts.length < 2) {
        return;
    }


    const timestamp =
        parts[0];

    const rest =
        parts[1];


    const colon =
        rest.indexOf(":");


    if (colon === -1) {
        return;
    }


    const username =
        rest.substring(
            0,
            colon
        );


    const text =
        rest.substring(
            colon + 1
        ).trim();


    const div =
        document.createElement("div");

    div.className =
        "message";


    const timestampSpan =
        document.createElement("span");

    timestampSpan.className =
        "timestamp";

    timestampSpan.textContent =
        timestamp;


    const usernameSpan =
        document.createElement("span");

    usernameSpan.className =
        "username";

    usernameSpan.textContent =
        username + ":";


    div.appendChild(
        timestampSpan
    );

    div.appendChild(
        document.createTextNode(" ")
    );

    div.appendChild(
        usernameSpan
    );

    div.appendChild(
        document.createTextNode(
            " " + text
        )
    );


    if (isAdmin) {

        if (
            showIDsCheckbox.checked
        ) {

            const id =
                document.createElement("span");

            id.className =
                "msgid";

            id.textContent =
                `[ID: ${message.id}]`;

            div.appendChild(
                id
            );
        }


        if (
            showDeleteCheckbox.checked
        ) {

            const button =
                document.createElement("button");

            button.className =
                "deleteBtn";

            button.textContent =
                "X";

            button.onclick =
                () => deleteMsg(
                    message.id
                );

            div.appendChild(
                button
            );
        }
    }


    chatBox.appendChild(
        div
    );
}


function renderMessagesFromDOM() {

    const messages = [];

    const elements =
        chatBox.querySelectorAll(
            ".message"
        );

    elements.forEach(element => {

        messages.push(
            element
        );
    });


    if (messages.length === 0) {
        return;
    }
}


function startPing() {

    stopPing();


    pingTimer =
        setInterval(() => {

            if (
                socket &&
                socket.readyState === WebSocket.OPEN
            ) {

                socket.send(
                    JSON.stringify({
                        type: "ping"
                    })
                );
            }

        }, 10000);
}


function stopPing() {

    if (pingTimer) {

        clearInterval(
            pingTimer
        );

        pingTimer = null;
    }
}


showIDsCheckbox.addEventListener(
    "change",
    () => {

        switchRoom(room);
    }
);


showDeleteCheckbox.addEventListener(
    "change",
    () => {

        switchRoom(room);
    }
);


connect();

</script>

</body>
</html>
