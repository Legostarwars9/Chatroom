<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Website Chat</title>
<style>
body {margin:0; background:#1e2128; color:#e6e6e6; font-family:Arial;}
#container {display:flex; height:100vh;}
#chatArea {flex:1; padding:15px;}
#sidebar {width:180px; background:#14161c; border-left:1px solid #3a3f4a; padding:10px;}
h2 {color:#7aa2f7; margin-top:0;}
input, button {background:#2a2f3a; color:#fff; border:1px solid #3a3f4a; padding:5px; margin:2px;}
button:hover {background:#3a3f4a; cursor:pointer;}
#chatBox {height:65vh; background:#111; border:1px solid #3a3f4a; overflow-y:auto; padding:6px; white-space:pre-wrap;}
.user {padding:2px; font-size:14px;}
.message {margin-bottom:4px;}
.timestamp {color:#888; font-size:12px;}
.username {color:#7aa2f7; font-weight:bold;}
.msgid {color:#555; font-size:10px; margin-left:5px; cursor:help;}
.deleteBtn {color:#f55; background:none; border:none; cursor:pointer; margin-left:5px;}

#statusPopup {
    position: fixed;
    right: 16px;
    bottom: 16px;
    max-width: 300px;
    padding: 8px 10px;
    background: #2a2f3a;
    color: #e6e6e6;
    border: 1px solid #3a3f4a;
    border-radius: 6px;
    font-size: 12px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
    white-space: pre-wrap;
    z-index: 1000;
}
#statusPopup.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<div id="statusPopup" role="status" aria-live="polite"></div>
<div id="container">
<div id="chatArea">
<h2>Website Chat</h2>

<div id="login">
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn" onclick="login()">Login</button>
    <button id="registerBtn" onclick="register()">Create Account</button>
    <div id="error" style="color:#ff5555; margin-top:5px;"></div>
</div>

<div id="chat" style="display:none;">
    <div>
        <button onclick="switchRoom('public')">Public</button>
        <button onclick="newRoom()">New Room</button>
        <input id="roomCode" placeholder="Enter Room Code" style="width:120px; margin-left:5px;">
        <button onclick="joinRoom()">Join</button>
        <span id="roomLabel"></span>
        <label id="showIDsLabel" style="margin-left:10px; display:none;">
            <input type="checkbox" id="showIDs"> Show Message IDs
        </label>
        <label id="showDeleteLabel" style="margin-left:10px; display:none;">
            <input type="checkbox" id="showDelete"> Show Quick Delete Buttons
        </label>
    </div>
    <div id="chatBox"></div>
    <input id="message" style="width:70%" placeholder="Message or command" maxlength="1000">
    <button id="sendBtn" onclick="send()">Send</button>
    <button id="logoutBtn" onclick="logout()">Logout</button>
</div>
</div>

<div id="sidebar">
    <b>Online Users</b>
    <div id="userList"></div>
</div>
</div>

<script>
// Pointing directly to your Python API Server
const API_URL = "https://chat.legostarwars9.com"; 

let user="", room="public";
let isAdmin=false;
let pollInterval = null;

const usernameInput=document.getElementById("username");
const passwordInput=document.getElementById("password");
const loginDiv=document.getElementById("login");
const chatDiv=document.getElementById("chat");
const errorDiv=document.getElementById("error");
const chatBox=document.getElementById("chatBox");
const messageInput=document.getElementById("message");
const userList=document.getElementById("userList");
const roomLabel=document.getElementById("roomLabel");
const showIDsCheckbox=document.getElementById("showIDs");
const showIDsLabel=document.getElementById("showIDsLabel");
const showDeleteCheckbox=document.getElementById("showDelete");
const showDeleteLabel=document.getElementById("showDeleteLabel");
const statusPopup = document.getElementById("statusPopup");

// Helper configuration to allow Cross-Origin Cookies
const fetchOptions = (method, body = null) => {
    const opts = {
        method: method,
        credentials: "include"
    };

    if (body !== null) {
        opts.headers = {
            "Content-Type": "application/json"
        };
        opts.body = JSON.stringify(body);
    }

    return opts;
};

function showStatus(msg) {
    statusPopup.textContent = typeof msg === 'object' ? JSON.stringify(msg) : msg;
    statusPopup.classList.add("show");
    setTimeout(() => statusPopup.classList.remove("show"), 3000);
}

// Check if user is already logged in on boot
window.onload = function() {
    fetch(`${API_URL}/whoami`, fetchOptions("GET"))
    .then(r => r.json()).then(d => {
        if(d.user) {
            user = d.user;
            showChat();
        }
    }).catch(err => console.log("Not logged in."));
};

// ---------------- Login / Logout / Register ----------------
function login(){
    user=usernameInput.value.trim();
    const pass=passwordInput.value.trim();
    if(!user||!pass){ errorDiv.textContent="Enter username and password"; return; }
    
    fetch(`${API_URL}/login`, fetchOptions("POST", {username:user, password:pass}))
    .then(r => {
        if(!r.ok) throw new Error("Login rejected");
        return r.json();
    })
    .then(d=>{
        if(d.status==="ok"){ 
            showChat(); 
        } else {
            errorDiv.textContent="Login failed: " + d.status;
        }
    }).catch(() => { errorDiv.textContent="Login failed. Check your credentials."; });
}

function register(){
    const u=usernameInput.value.trim();
    const p=passwordInput.value.trim();
    if(!u||!p){ errorDiv.textContent="Enter username/password"; return; }
    
    fetch(`${API_URL}/register`, fetchOptions("POST", {username:u, password:p}))
    .then(r => {
        if(r.status === 409) errorDiv.textContent = "Username exists";
        else if(r.status === 410) errorDiv.textContent = "Invalid characters";
        else if(r.ok) errorDiv.textContent = "Account created!";
        else errorDiv.textContent = "Registration failed";
    });
}

function logout(){ 
    fetch(`${API_URL}/logout`, fetchOptions("GET")).then(()=>location.reload()); 
}

function showChat(){ 
    loginDiv.style.display="none"; 
    chatDiv.style.display="block";
    checkAdmin();
    startPolling();
}

function checkAdmin() {
    fetch(`${API_URL}/command`, fetchOptions("POST", {cmd: "/checkrole"}))
    .then(r => r.json()).then(d => {
        if(d.role === "admin") {
            isAdmin = true;
            showIDsLabel.style.display = "inline";
            showDeleteLabel.style.display = "inline";
        }
    });
}

// ---------------- Chat Engine ----------------
function startPolling() {
    loadMessagesAndUsers();
    if(pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(loadMessagesAndUsers, 2000); // Polls backend every 2 seconds
}

function loadMessagesAndUsers(){
    // Fetch Messages
    fetch(`${API_URL}/messages?room=${room}`, fetchOptions("GET"))
    .then(r=>r.json()).then(d=>{
        const isAtBottom = chatBox.scrollTop + chatBox.clientHeight >= chatBox.scrollHeight - 5;
        renderMessages(d);
        if(isAtBottom) chatBox.scrollTop = chatBox.scrollHeight;
    });

    // Fetch Active Users List
    fetch(`${API_URL}/users`, fetchOptions("GET"))
    .then(r=>r.json()).then(users=>{
        userList.innerHTML = users.map(u => `<div class="user">${u}</div>`).join("");
    });
}

function renderMessages(data){
    chatBox.innerHTML = data.map(m=>{
        let parts = m.text.split("|");
        if(parts.length<2) return "";
        let ts = parts[0];
        let rest = parts[1];
        let uname = rest.split(":")[0];
        let msg = rest.split(":").slice(1).join(":").trim();
        
        let html = `<div class="message"><span class="timestamp">${ts}</span> <span class="username">${uname}:</span> ${msg}`;
        if(isAdmin){
            if(showIDsCheckbox.checked) html += ` <span class="msgid">[ID: ${m.id}]</span>`;
            if(showDeleteCheckbox.checked) html += ` <button class="deleteBtn" onclick="deleteMsg('${m.id}')">X</button>`;
        }
        html += `</div>`;
        return html;
    }).join("");
    roomLabel.textContent = room==="public"?"":"Room "+room;
}

function send(){ 
    const msg = messageInput.value.trim(); 
    if(!msg) return; 
    messageInput.value = "";

    const endpoint = msg.startsWith("/") ? "/command" : "/send";
    const payload = msg.startsWith("/") ? {cmd: msg} : {message: msg, room: room};

    fetch(`${API_URL}${endpoint}`, fetchOptions("POST", payload))
    .then(r => {
        if (msg.startsWith("/")) {
            if(r.status === 403) { showStatus("Admin only."); return; }
            if(r.status === 404) { showStatus("User not found."); return; }
            return r.json().then(res => showStatus(res.message || res.status));
        }
        return r.json().then(res => {
            if(res.status !== "ok") errorDiv.textContent = "Status: " + res.status;
        });
    });
}
messageInput.onkeydown = (e) => { if(e.key === "Enter") send(); };

function deleteMsg(mid) {
    fetch(`${API_URL}/command`, fetchOptions("POST", {cmd: `/delete ${mid}`}))
    .then(() => loadMessagesAndUsers());
}

// ---------------- Rooms ----------------
function switchRoom(newRoom) {
    fetch(`${API_URL}/room/join`, fetchOptions("POST", {room: newRoom}))
    .then(r => {
        if(r.ok) {
            room = newRoom;
            loadMessagesAndUsers();
        } else {
            showStatus("Failed to join room.");
        }
    });
}

function joinRoom() {
    const code = document.getElementById("roomCode").value.trim();
    if(code) switchRoom(code);
}

function newRoom() {
    fetch(`${API_URL}/room/new`, fetchOptions("GET"))
    .then(r => r.text()).then(roomCode => {
        switchRoom(roomCode);
    });
}
</script>
</body>
</html>
